<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼성빌라 주민 서명 - 논골버스</title>
    <meta name="description" content="서대문01 마을버스가 삼성빌라까지 모든 차량이 운행하도록 요청하는 주민 서명입니다.">
    <meta property="og:title" content="삼성빌라 주민 서명 - 서대문01 마을버스 운행 개선">
    <meta property="og:description" content="겨울이 오기 전에, 삼성빌라까지 모든 버스가 올라오도록 함께 서명해 주세요.">
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --line: #d1d5db;
            --text: #1f2937;
            --muted: #6b7280;
            --brand: #0f4c81;
            --accent: #1d4ed8;
            --ok: #047857;
            --ok-bg: #ecfdf5;
            --err: #b91c1c;
            --err-bg: #fef2f2;
        }
        * { box-sizing: border-box; }
        /* 글자 크기는 전부 rem/em 이다. 기기·브라우저의 글자 크기 설정이 그대로 반영되게.
           아이폰은 -apple-system-body 로 "설정 > 손쉬운 사용 > 더 큰 텍스트"를 따른다. */
        html { font-size: 112.5%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        @supports (font: -apple-system-body) {
            html { font: -apple-system-body; }
        }
        body {
            margin: 0;
            padding: 20px 16px 48px;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 1.06rem;
            line-height: 1.65;
            /* 한글은 어절 단위로 줄을 바꾼다. 긴 링크 같은 건 그래도 넘치지 않게 끊는다. */
            word-break: keep-all;
            overflow-wrap: anywhere;
        }
        main { max-width: 680px; margin: 0 auto; }
        h1 { color: var(--brand); font-size: 1.45rem; line-height: 1.4; margin: 0 0 12px; }
        h2 { color: var(--accent); font-size: 1.2rem; margin: 28px 0 8px; }
        h3 { font-size: 1.05rem; margin: 18px 0 4px; }
        p { margin: 8px 0; }
        ol, ul { padding-left: 1.4em; }
        li { margin-bottom: 10px; white-space: pre-line; }
        section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
        }
        .count { font-size: 1.1rem; font-weight: 700; color: var(--brand); }
        .count strong { font-size: 1.6rem; }
        label { display: block; font-weight: 600; margin: 16px 0 6px; }
        .hint { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
        input[type="text"], input[type="tel"], select {
            width: 100%;
            font-size: 1.05rem;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--text);
        }
        .row { display: flex; gap: 8px; align-items: center; }
        .row input { flex: 1; }
        .consent { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
        .consent label { display: flex; gap: 10px; align-items: flex-start; margin: 0; cursor: pointer; }
        .consent input { width: 1.4em; height: 1.4em; flex: none; margin-top: 0.15em; }
        details { margin-top: 8px; }
        summary { color: var(--accent); cursor: pointer; font-size: 0.95rem; }
        .consent-text { white-space: pre-line; font-size: 0.92rem; color: #374151; background: #f9fafb; border-radius: 8px; padding: 10px; margin-top: 6px; }
        button {
            font: inherit;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .primary { width: 100%; margin-top: 22px; background: var(--accent); color: #fff; font-size: 1.15rem; }
        .primary:disabled { background: #9ca3af; cursor: default; }
        .secondary { background: #fff; color: var(--accent); border-color: var(--accent); }
        .link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 8px 0; font-weight: 400; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .msg { border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
        .msg.err { background: var(--err-bg); color: var(--err); }
        .msg.ok { background: var(--ok-bg); color: var(--ok); }
        .done { background: var(--ok-bg); border-color: #a7f3d0; }
        .done .title { color: var(--ok); font-weight: 700; font-size: 1.15rem; }
        .closed { background: #f3f4f6; border-color: #d1d5db; }
        .closed .title { font-weight: 700; font-size: 1.1rem; }
        [hidden] { display: none !important; }
        footer { text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 28px; }
        footer a { color: var(--accent); }
    </style>
</head>
<body>
<main>
    <p id="loading">불러오는 중…</p>

    <section id="error-box" hidden>
        <p id="error-text"></p>
        <button class="secondary" id="retry">다시 시도</button>
    </section>

    <section id="inactive" hidden>
        <h1>지금은 진행 중인 서명이 없어요</h1>
        <p><a href="index.html">논골버스 소개 페이지로 가기</a></p>
    </section>

    <div id="petition" hidden>
        <section>
            <h1 id="title"></h1>
            <p class="count">현재 <strong id="count">0</strong>명이 서명했어요</p>
            <p class="hint" id="deadline" hidden></p>
        </section>

        <section id="closed" class="closed" hidden>
            <p class="title" id="closed-text"></p>
            <p>모두 <strong id="closed-count">0</strong>명이 함께해 주셨어요.</p>
        </section>

        <section id="done" class="done" hidden>
            <p class="title">✓ 서명 완료 · 현재 <span id="done-count">0</span>명</p>
            <p>함께해 주셔서 감사합니다. 이웃에게 링크를 전해 주시면 큰 힘이 됩니다.</p>
            <div class="actions">
                <button class="secondary copy-link">링크 복사</button>
            </div>
            <button class="link" id="withdraw">서명 철회</button>
        </section>

        <section>
            <div id="body"></div>
        </section>

        <section id="form-box">
            <h2 style="margin-top:0">서명하기</h2>
            <form id="form" novalidate>
                <label for="name">이름</label>
                <input type="text" id="name" autocomplete="name" maxlength="20" required>

                <label for="residence">거주지</label>
                <select id="residence" required>
                    <option value="">선택해 주세요</option>
                </select>
                <div id="unit-box" hidden>
                    <label for="unit">동 번호</label>
                    <div class="row"><input type="text" id="unit" inputmode="numeric" maxlength="6"><span>동</span></div>
                </div>
                <div id="other-box" hidden>
                    <label for="other">거주지 직접 입력</label>
                    <input type="text" id="other" maxlength="30" placeholder="예: 홍제동">
                </div>

                <label for="phone">연락처 <span class="hint">(선택 · 진행 상황 안내용, 기관에는 제공하지 않아요)</span></label>
                <input type="tel" id="phone" autocomplete="tel" inputmode="tel" maxlength="13" placeholder="010-0000-0000">

                <div id="consents"></div>

                <div class="msg err" id="form-error" hidden></div>
                <button type="submit" class="primary" id="submit">서명하기</button>
            </form>
        </section>

        <section id="share-box">
            <p>주변 이웃에게도 알려 주세요.</p>
            <button class="secondary copy-link">링크 복사</button>
            <div class="msg ok" id="copied" hidden>링크를 복사했어요. 카카오톡이나 문자에 붙여넣어 보내 주세요.</div>
        </section>
    </div>

    <footer>
        <p><a href="index.html">논골버스</a> · <a href="privacy.html">개인정보처리방침</a></p>
    </footer>
</main>

<script>
(function () {
    'use strict';

    // 로컬에서 열면 로컬 서버를, 그 외에는 운영 API 를 부른다.
    var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? 'http://localhost:13510'
        : 'https://api.nongolbus.mauvemove.com';
    var TOKEN_KEY = 'nongolbus.signerToken';
    var GENERIC_ERROR = '잠시 문제가 생겼어요. 잠시 후 다시 시도해 주세요.';

    var state = { petition: null, busy: false };
    var $ = function (id) { return document.getElementById(id); };

    // 서명자 토큰. 이 브라우저에서 처음 열 때 한 번 만들고 계속 쓴다.
    // 저장이 막힌 환경(사생활 보호 모드 등)에서는 이 페이지를 연 동안만 유지된다.
    var memoryToken = null;
    function newToken() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        var b = new Uint8Array(16);
        crypto.getRandomValues(b);
        return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    }
    function token() {
        try {
            var t = localStorage.getItem(TOKEN_KEY);
            if (!t) { t = newToken(); localStorage.setItem(TOKEN_KEY, t); }
            return t;
        } catch (e) {
            if (!memoryToken) memoryToken = newToken();
            return memoryToken;
        }
    }

    function api(method, path, body) {
        var opts = { method: method, headers: { 'X-Signer-Token': token() } };
        if (body) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        return fetch(API + path, opts).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
                return { ok: res.ok, status: res.status, data: data };
            });
        });
    }

    function show(id) {
        ['loading', 'error-box', 'inactive', 'petition'].forEach(function (x) { $(x).hidden = x !== id; });
    }

    function load() {
        show('loading');
        return api('GET', '/api/petitions/current').then(function (r) {
            if (!r.ok) throw new Error(r.data.userMessage || GENERIC_ERROR);
            if (!r.data.active) { show('inactive'); return; }
            render(r.data);
            show('petition');
        }).catch(function (e) {
            $('error-text').textContent = e && e.message && e.message !== 'Failed to fetch' ? e.message : GENERIC_ERROR;
            show('error-box');
        });
    }

    function el(tag, text) {
        var n = document.createElement(tag);
        if (text != null) n.textContent = text;
        return n;
    }

    function render(p) {
        state.petition = p;
        document.title = '주민 서명 - ' + p.title;
        $('title').textContent = p.title;

        var body = $('body');
        body.textContent = '';
        p.blocks.forEach(function (b) {
            if (b.type === 'heading') body.appendChild(el('h2', b.text));
            else if (b.type === 'subheading') body.appendChild(el('h3', b.text));
            else if (b.type === 'list') {
                var list = el(b.ordered ? 'ol' : 'ul');
                (b.items || []).forEach(function (it) { list.appendChild(el('li', it)); });
                body.appendChild(list);
            } else body.appendChild(el('p', b.text));
        });

        var sel = $('residence');
        var current = sel.value;
        while (sel.options.length > 1) sel.remove(1);
        p.residences.forEach(function (r) {
            var o = el('option', r.label);
            o.value = r.id;
            sel.appendChild(o);
        });
        sel.value = current;
        onResidence();

        var box = $('consents');
        box.textContent = '';
        p.consents.forEach(function (c) {
            var wrap = el('div');
            wrap.className = 'consent';
            var label = el('label');
            var cb = el('input');
            cb.type = 'checkbox';
            cb.dataset.consent = c.id;
            cb.dataset.required = c.required ? '1' : '';
            label.appendChild(cb);
            label.appendChild(el('span', c.title));
            wrap.appendChild(label);
            var det = el('details');
            det.appendChild(el('summary', '내용 보기'));
            var txt = el('div', c.text);
            txt.className = 'consent-text';
            det.appendChild(txt);
            wrap.appendChild(det);
            box.appendChild(wrap);
        });

        // 마감 시각은 "그 순간부터 마감"이라, 날짜로 보일 때는 1초 전 날짜를 쓴다.
        if (p.closesAt && !p.closed) {
            var d = new Date(new Date(p.closesAt).getTime() - 1000);
            var kst = new Date(d.getTime() + (9 * 60 + d.getTimezoneOffset()) * 60000);
            $('deadline').textContent = kst.getFullYear() + '년 ' + (kst.getMonth() + 1) + '월 ' + kst.getDate() + '일까지 서명을 받아요.';
            $('deadline').hidden = false;
        } else {
            $('deadline').hidden = true;
        }
        $('closed').hidden = !p.closed;
        $('closed-text').textContent = p.closedMessage || '지금은 서명을 받지 않고 있어요.';

        setStatus(p.count, p.signed);
        // 마감되면 퍼뜨릴 이유가 없으니 링크 복사도 감춘다.
        var canShare = !!p.shareUrl && !p.closed;
        document.querySelectorAll('.copy-link').forEach(function (b) { b.hidden = !canShare; });
        $('share-box').hidden = !canShare;
        $('done').querySelector('p:not(.title)').textContent = p.closed
            ? '함께해 주셔서 감사합니다.'
            : '함께해 주셔서 감사합니다. 이웃에게 링크를 전해 주시면 큰 힘이 됩니다.';
    }

    function setStatus(count, signed) {
        state.petition.count = count;
        state.petition.signed = signed;
        $('count').textContent = count;
        $('done-count').textContent = count;
        $('closed-count').textContent = count;
        $('done').hidden = !signed;
        // 마감되면 서명 폼은 닫는다. 이미 서명한 사람의 완료 카드(철회 포함)는 그대로 둔다.
        $('form-box').hidden = signed || state.petition.closed;
    }

    function onResidence() {
        var p = state.petition;
        var r = p && p.residences.filter(function (x) { return x.id === $('residence').value; })[0];
        $('unit-box').hidden = !(r && r.unit);
        $('other-box').hidden = !(r && r.other);
    }

    function formError(msg) {
        var e = $('form-error');
        e.textContent = msg || '';
        e.hidden = !msg;
    }

    function submit(ev) {
        ev.preventDefault();
        if (state.busy) return;
        var p = state.petition;

        // 빈칸 정도는 서버까지 가기 전에 알려준다. 최종 판정은 서버가 한다.
        if (!$('name').value.trim()) return formError('이름을 입력해 주세요.');
        if (!$('residence').value) return formError('거주지를 선택해 주세요.');
        if (!$('unit-box').hidden && !$('unit').value.trim()) return formError('동 번호를 입력해 주세요.');
        if (!$('other-box').hidden && !$('other').value.trim()) return formError('거주지를 입력해 주세요.');

        var consents = {};
        var missing = false;
        document.querySelectorAll('[data-consent]').forEach(function (cb) {
            consents[cb.dataset.consent] = cb.checked;
            if (cb.dataset.required && !cb.checked) missing = true;
        });
        if (missing) return formError('필수 동의 항목에 모두 동의해 주세요.');

        formError('');
        state.busy = true;
        $('submit').disabled = true;
        $('submit').textContent = '보내는 중…';

        api('POST', '/api/petitions/' + encodeURIComponent(p.id) + '/signatures', {
            name: $('name').value,
            residenceId: $('residence').value,
            residenceUnit: $('unit-box').hidden ? '' : $('unit').value,
            residenceOther: $('other-box').hidden ? '' : $('other').value,
            phone: $('phone').value,
            source: 'web',
            bodyVersion: p.bodyVersion,
            consents: consents
        }).then(function (r) {
            if (r.ok) {
                setStatus(r.data.count, true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            if (r.status === 403 && r.data.code === 'PETITION_CLOSED') {
                // 화면을 연 사이에 마감됐다. 다시 불러오면 폼이 닫히고 마감 안내가 뜬다.
                return api('GET', '/api/petitions/current').then(function (g) {
                    if (g.ok && g.data.active) render(g.data);
                    alert(r.data.userMessage || '서명이 마감되었어요.');
                });
            }
            if (r.status === 409) {
                // 화면을 연 사이에 청원문이 바뀌었다. 입력값은 그대로 두고 문구만 새로 불러온다.
                return api('GET', '/api/petitions/current').then(function (g) {
                    if (g.ok && g.data.active) render(g.data);
                    formError(r.data.userMessage || '청원문이 바뀌었어요. 다시 확인해 주세요.');
                });
            }
            formError(r.data.userMessage || GENERIC_ERROR);
        }).catch(function () {
            formError(GENERIC_ERROR);
        }).then(function () {
            state.busy = false;
            $('submit').disabled = false;
            $('submit').textContent = '서명하기';
        });
    }

    function withdraw() {
        if (state.busy) return;
        if (!confirm('서명을 철회할까요? 입력하신 정보는 바로 삭제됩니다.')) return;
        state.busy = true;
        api('DELETE', '/api/petitions/' + encodeURIComponent(state.petition.id) + '/signatures').then(function (r) {
            if (r.ok) setStatus(r.data.count, false);
            else alert(r.data.userMessage || GENERIC_ERROR);
        }).catch(function () {
            alert(GENERIC_ERROR);
        }).then(function () { state.busy = false; });
    }

    function copyLink(ev) {
        var btn = ev.currentTarget;
        var url = (state.petition && state.petition.shareUrl) || location.href;
        var done = function () {
            // 버튼 자체에 표시한다. 아래쪽 안내문은 화면 밖에 있을 수 있다.
            btn.textContent = '복사했어요 ✓';
            $('copied').hidden = false;
            setTimeout(function () {
                btn.textContent = '링크 복사';
                $('copied').hidden = true;
            }, 4000);
        };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(done, function () { fallbackCopy(url); done(); });
        } else {
            fallbackCopy(url);
            done();
        }
    }
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) { /* 복사 불가 환경 — 주소창 링크를 직접 복사해야 한다 */ }
        document.body.removeChild(ta);
    }

    $('residence').addEventListener('change', onResidence);
    $('form').addEventListener('submit', submit);
    $('withdraw').addEventListener('click', withdraw);
    $('retry').addEventListener('click', load);
    document.querySelectorAll('.copy-link').forEach(function (b) { b.addEventListener('click', copyLink); });

    load();
})();
</script>
</body>
</html>
