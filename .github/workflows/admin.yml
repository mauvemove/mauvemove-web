name: admin

on:
  pull_request:
    paths: ["admin/**", ".github/workflows/admin.yml"]
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/admin.yml"]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/server/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/web/package-lock.json
      - run: npm ci
      - run: npm run build
